<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aceita sair comigo?</title>
</head>

<body>
    <div id="conteudo">
        <h2>Aceita sair comigo?</h2>
        <div class="btn-container">
            <button class="btn" onclick="sim()">SIM</button>
            <button class="btn" onclick="desvia(this)" onmouseover="desvia(this)">NÃO</button>
        </div>
    </div>
</body>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    #conteudo {
        background: #ff7a7a;
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
        padding: 10px;
        text-align: center;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    h2 {
        font-size: clamp(1.5rem, 5vw, 2.5rem);
        margin-bottom: 2rem;
        color: white;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .btn-container {
        margin: auto;
        width: 100%;
        max-width: 200px;
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .btn {
        background: black;
        color: white;
        border: none;
        padding: clamp(8px, 2vw, 12px);
        width: clamp(70px, 20vw, 100px);
        font-size: clamp(0.9rem, 2vw, 1rem);
        border-radius: 5px;
        cursor: pointer;
        transition: transform 0.2s ease;
    }

    .btn:hover {
        transform: scale(1.05);
    }

    @media (max-width: 600px) {
        #conteudo {
            padding: 15px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .btn-container {
            gap: 15px;
        }

        .btn {
            padding: 10px;
            width: 80px;
            font-size: 0.9rem;
        }
    }

    @media (min-width: 601px) and (max-width: 1024px) {
        h2 {
            font-size: 2rem;
        }

        .btn {
            padding: 11px;
            width: 90px;
        }
    }

    @media (min-width: 1025px) {
        h2 {
            font-size: 2.5rem;
        }

        .btn {
            padding: 12px;
            width: 100px;
        }
    }
</style>

<script>
    function sim() {
        alert("Você aceitou sair comigo! ;)");
        location.href = "https://music.youtube.com/watch?v=izGwDsrQ1eQ";
    }

    function desvia(btn) {
        btn.style.position = 'fixed';
        btn.style.bottom = geraPosicao(10, 85);
        btn.style.left = geraPosicao(10, 85);
        btn.style.width = 'clamp(70px, 20vw, 100px)';
        console.log('opa, desviei...');
    }

    function geraPosicao(min, max) {
        return (Math.random() * (max - min) + min) + "%";
    }

</script>


</html>
